<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Fixeo · Sin conexión</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #ffffff;
        color: #0f172a;
      }

      img {
        width: 64px;
        height: 64px;
      }

      h1 {
        font-size: 1.25rem;
        margin: 0;
        color: #115e59;
      }

      p {
        margin: 0;
        color: #475569;
        max-width: 320px;
      }

      button {
        min-height: 44px;
        min-width: 44px;
        padding: 0 24px;
        border: none;
        border-radius: 9999px;
        background: #0f766e;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid #0f766e;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <img src="/icon-192.png" alt="" />
    <h1>Estás sin conexión</h1>
    <p>No pudimos cargar Fixeo porque no hay internet. Revisá tu conexión e intentá de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </body>
</html>
