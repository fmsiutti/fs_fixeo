name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fixeo
          POSTGRES_PASSWORD: fixeo
          POSTGRES_DB: fixeo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixeo -d fixeo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://fixeo:fixeo@localhost:5432/fixeo?schema=public"
      # No son secretos reales: solo hace falta que la api pueda arrancar en CI.
      JWT_ACCESS_SECRET: "ci-secreto-de-prueba-no-usar-en-produccion"
      TWILIO_DRIVER: "log"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build de packages/shared
        run: pnpm --filter @fixeo/shared run build

      - name: Generar Prisma Client
        run: pnpm --filter @fixeo/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Migrar base de datos
        run: pnpm --filter @fixeo/api exec prisma migrate deploy

      - name: Test e2e (api)
        run: pnpm --filter @fixeo/api run test:e2e
